apiVersion: apps/v1
kind: Deployment
metadata:
  name: agile-kubernetes
  labels:
    app: agile-kubernetes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agile-kubernetes
  template:
    metadata:
      labels:
        app: agile-kubernetes
    spec:
      containers:
      - name: agile-kubernetes
        image: harikrishna7416/agile-kubernetes:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: agile-kubernetes-service
spec:
  type: NodePort
  selector:
    app: agile-kubernetes
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30007
